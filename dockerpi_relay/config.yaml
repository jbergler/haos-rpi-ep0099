name: DockerPi Relay (EP-0099)
version: "0.1.5"
slug: dockerpi_relay
description: Expose a 52Pi / GeeekPi DockerPi 4-channel I2C relay HAT (EP-0099) to Home Assistant via MQTT discovery.
arch:
  - aarch64
  - armv7
  - armhf
startup: services
boot: auto
init: false
host_network: false
hassio_api: false
services:
  - mqtt:need
devices:
  - /dev/i2c-1:/dev/i2c-1:rwm
privileged:
  - SYS_RAWIO
options:
  i2c_bus: 1
  base_topic: dockerpi_relay
  device_name: DockerPi Relay
  startup_state: restore
  relays:
    - address: "0x10"
      channel: 1
      name: Relay 1
      wiring: normally_open
    - address: "0x10"
      channel: 2
      name: Relay 2
      wiring: normally_open
    - address: "0x10"
      channel: 3
      name: Relay 3
      wiring: normally_open
    - address: "0x10"
      channel: 4
      name: Relay 4
      wiring: normally_open
schema:
  i2c_bus: int(0,2)
  base_topic: str
  device_name: str
  startup_state: list(restore|off|on)
  relays:
    - address: match(^0x[0-9a-fA-F]{1,2}$)
      channel: int(1,8)
      name: str?
      wiring: list(normally_open|normally_closed)?
