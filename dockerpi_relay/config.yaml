name: DockerPi Relay (EP-0099)
version: "0.1.2"
slug: dockerpi_relay
description: Expose a 52Pi / GeeekPi DockerPi 4-channel I2C relay HAT (EP-0099) to Home Assistant via MQTT discovery.
arch:
  - aarch64
  - armv7
  - armhf
startup: services
boot: auto
init: false
host_network: false
hassio_api: false
services:
  - mqtt:need
devices:
  - /dev/i2c-1:/dev/i2c-1:rwm
privileged:
  - SYS_RAWIO
options:
  i2c_bus: 1
  i2c_addresses:
    - "0x10"
  num_relays: 4
  base_topic: dockerpi_relay
  device_name: DockerPi Relay
  startup_state: restore
  poll_interval: 0
  relays: []
schema:
  i2c_bus: int(0,2)
  i2c_addresses:
    - match(^0x[0-9a-fA-F]{1,2}$)
  num_relays: int(1,8)
  base_topic: str
  device_name: str
  startup_state: list(restore|off|on)
  poll_interval: int(0,3600)
  relays:
    - address: match(^0x[0-9a-fA-F]{1,2}$)
      channel: int(1,8)
      name: str?
      wiring: list(normally_open|normally_closed)?
