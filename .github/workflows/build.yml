name: Build add-on

on:
  push:
    branches: [main]
    paths:
      - "dockerpi_relay/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "dockerpi_relay/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build add-on
        uses: home-assistant/builder@2024.08.2
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/dockerpi_relay \
            --image "{arch}-dockerpi-relay" \
            --test \
            --docker-hub local
