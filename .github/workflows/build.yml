name: Check

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dockerpi_relay/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dockerpi_relay/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  check:
    name: cargo check (aarch64-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target aarch64-unknown-linux-musl --locked
      - run: cargo fmt --check
      - run: cargo clippy --target aarch64-unknown-linux-musl --locked -- -D warnings
